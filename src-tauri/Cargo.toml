[package]
name = "rmemo"
version = "1.1.1"
description = "Quick-capture notes for Windows"
authors = ["hirosugu415"]
edition = "2021"
default-run = "rmemo"

[lib]
name = "rmemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8"
parking_lot = "0.12.5"
notify-debouncer-full = "0.7.0"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["clock"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Storage_Packaging_Appx",
] }
# `Window::hwnd()` returns this crate's HWND (not windows-sys's) — same
# representation, different type, so both crates are needed side by side.
# The WinRT StartupTask/activation APIs (packaged.rs) and the OCR engine
# (notes/ocr.rs) only exist in `windows`.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_WinRT",
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }
# Decodes pasted images for OCR — in-process, since Windows only reads WebP
# (what screenshots are saved as) with an optional codec installed.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
